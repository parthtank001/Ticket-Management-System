# Local Development & Testing Docker Compose Setup
# Run entire full-stack application (PostgreSQL + AI Backend + React Frontend):
#   docker compose up --build

services:
  # 1. PostgreSQL Database Service
  postgres:
    image: postgres:16-alpine
    container_name: helpdesk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: helpdesk
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d helpdesk"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Helpdesk AI Application (Express 5 + Better Auth + React SPA + pg-boss)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: helpdesk-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/helpdesk?schema=public
      - BETTER_AUTH_SECRET=local-production-auth-secret-key-32chars
      - BETTER_AUTH_URL=http://localhost:5000
      - TRUSTED_ORIGIN=http://localhost:5000,http://127.0.0.1:5000,http://localhost:5173
      - AI_PROVIDER=gemini
      - GEMINI_MODEL=gemini-3.5-flash-lite
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ADMIN_EMAIL=admin@example.com
      - ADMIN_PASSWORD=password123
      - AGENT_EMAIL=agent@example.com
      - AGENT_PASSWORD=password123
      - AI_AGENT_EMAIL=ai@example.com
      - AI_AGENT_PASSWORD=password123
      - SUPPORT_EMAIL=support@example.com
      - WEBHOOK_SECRET=whsec_helpdesk_inbound_secret_token_key_2026

volumes:
  pgdata:
    driver: local
